version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: fma_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      timeout: 5s
      retries: 5
      interval: 5s

  redis:
    image: redis:7-alpine
    container_name: fma_redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: .
    container_name: fma_web
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - .:/fma
      - static_volume:/fma/static
      - media_volume:/fma/media

  celery_worker:
    build: .
    container_name: fma_celery_worker
    command: celery -A config worker --loglevel=info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - .:/fma

  celery_beat:
    build: .
    container_name: fma_celery_beat
    command: celery -A config beat --loglevel=info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - .:/fma

  nginx:
    image: nginx:1.25-alpine
    container_name: fma_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/fma/static:ro
      - media_volume:/fma/media:ro
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume:
  media_volume:
